<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — CORAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header class="header">
      <div class="container header__top">
        <p class="logo"><a href="index.html">CORAL</a></p>
        <ul class="user-nav">
          <li><a href="index.html">Shop</a></li>
        </ul>
      </div>
    </header>
    <main class="container page">
      <h1>Add product</h1>
      <p data-admin-gate hidden>Sign in as admin@coral.local / admin123</p>
      <form class="admin-form" data-admin-form>
        <p class="form__row">
          <label for="title">Title</label>
          <input id="title" name="title" required />
          <span class="form__error">Enter a title</span>
        </p>
        <p class="form__row">
          <label for="category">Category</label>
          <input id="category" name="category" value="Dress" />
        </p>
        <p class="form__row">
          <label for="price">Price</label>
          <input id="price" name="price" type="number" min="1" step="0.01" required />
          <span class="form__error">Enter a price</span>
        </p>
        <p class="form__row">
          <label for="image">Image URL</label>
          <input id="image" name="image" value="/assets/images/product-green-dress.jpg" />
        </p>
        <p class="form__row">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4"></textarea>
        </p>
        <p class="form__row">
          <label><input type="checkbox" name="bestseller" /> Bestseller</label>
        </p>
        <button class="btn" type="submit">Create card</button>
      </form>
      <p class="admin-status" data-admin-status></p>
    </main>
    <script type="module" src="js/AdminPage.js"></script>
  </body>
</html>
